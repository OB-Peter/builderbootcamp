<header class="admin-header">
  <div class="header-container">
    <div class="brand-group">
      <a routerLink="/dashboard" class="brand-link">
        <div class="brand-badge">BB</div>
        <div class="brand-text">
          <span class="brand-title">BuilderBootcamp</span>
          <span class="brand-tag">Admin Portal</span>
        </div>
      </a>
      <span class="version-chip">v1.0</span>
    </div>

    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span>Dashboard</span>
      </a>
    </nav>

    <div class="header-actions">
      <div class="status-indicator success" title="API Status">
        <span class="dot"></span>
        <span>Live API</span>
      </div>

      <div class="user-profile">
        <div class="avatar">
          {{ (currentUser?.name || 'A').charAt(0).toUpperCase() }}
        </div>
        <div class="user-info">
          <span class="user-name">{{ currentUser?.name || 'Admin' }}</span>
          <span class="user-role">{{ currentUser?.role || 'Administrator' }}</span>
        </div>
        <button (click)="onLogout()" class="btn-logout" title="Sign out of Admin Portal">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>
